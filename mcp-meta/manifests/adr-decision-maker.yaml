apiVersion: mcp-meta/v1
kind: ToolPod
metadata:
  name: adr-decision-maker
  description: "ADR debate decision-maker agent"
spec:
  command: ["sh", "-c", "[ -x ./pods/adr-decision-maker/adr-decision-maker ] && exec ./pods/adr-decision-maker/adr-decision-maker || exec go run ./pods/adr-decision-maker/main.go"]
  callTimeout: 180s
  shutdownTimeout: 5s
  tools:
    - name: decide
      description: "ADR decision-maker tool"
    - name: ping
      description: "Health check"
