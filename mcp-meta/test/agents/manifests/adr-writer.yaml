apiVersion: mcp-meta/v1
kind: ToolPod
metadata:
  name: adr-writer
  description: "ADR debate writer agent"
spec:
  command: ["go", "run", "./pods/adr-writer/main.go"]
  callTimeout: 45s
  shutdownTimeout: 5s
  tools:
    - name: write
      description: "ADR writer tool"
    - name: ping
      description: "Health check"
