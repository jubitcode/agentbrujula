[project]
name = "research-agent"
version = "0.1.0"
description = "Off-chain agent orchestration library for the AgentBrujula marketplace"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.30.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "trafilatura>=2.0.0",
    "lxml>=5.0.0",
    "truststore>=0.10.4",
    "tokenizers>=0.22.2",
    "jinja2>=3.1.6",
    "pymupdf>=1.24.0",
    "stellar-sdk>=13.2.1",
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "PyJWT[crypto]>=2.8.0",
    "psycopg2-binary>=2.9.0",
    "slowapi>=0.1.9",
    "pytest-asyncio>=1.3.0",
]

[project.optional-dependencies]
full = [
    "playwright>=1.40.0",
    "easyocr>=1.7.0",
]
test = [
    "pytest>=7.0.0",
]
embeddings = [
    "sentence-transformers>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
